    <circle cx="1040" cy="280" r="210" fill="#6AE4FF" fill-opacity="0.20"/>
    <circle cx="1180" cy="420" r="240" fill="#7C5CFF" fill-opacity="0.20"/>
    <circle cx="930" cy="470" r="260" fill="#FFFFFF" fill-opacity="0.06"/>
  </g>

  <g opacity="0.92">
    <path d="M520 270c-54 0-98 44-98 98v168c0 38 22 72 56 88v44c0 34 27 62 62 62h30c34 0 62-28 62-62V368c0-54-44-98-98-98h-14z"
          fill="#E8EEFC" fill-opacity="0.10" stroke="#E8EEFC" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M540 330c-30 0-54 24-54 54v120c0 30 24 54 54 54h12c30 0 54-24 54-54V384c0-30-24-54-54-54h-12z"
          fill="#0B1220" fill-opacity="0.45" stroke="#E8EEFC" stroke-opacity="0.20" stroke-width="2"/>

